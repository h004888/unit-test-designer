name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: test (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Cài dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,yaml]"

      - name: Chạy test
        run: python -m pytest -q

  build:
    name: build wheel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài build
        run: python -m pip install --upgrade build

      - name: Build
        run: python -m build

      - name: Xác nhận wheel chứa dữ liệu runtime
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          wheel = glob.glob("dist/*.whl")
          if not wheel:
              sys.exit("Không tìm thấy file .whl trong dist/")
          names = zipfile.ZipFile(wheel[0]).namelist()
          rules = [n for n in names if n.startswith("utd/_data/rules/") and n.endswith(".json")]
          datas = [n for n in names if n.startswith("utd/_data/data/") and n.endswith(".json")]
          skill = [n for n in names if n.endswith("_data/skill/SKILL.md")]
          print(f"rules: {len(rules)}, data: {len(datas)}, SKILL.md: {len(skill)}")
          if len(rules) != 10:
              sys.exit(f"Thiếu rule: cần 10, có {len(rules)} — kiểm package-data")
          if len(datas) != 3:
              sys.exit(f"Thiếu data: cần 3, có {len(datas)} — kiểm package-data")
          if not skill:
              sys.exit("Thiếu utd/_data/skill/SKILL.md — kiểm package-data")
          print("wheel tự chứa: OK")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
