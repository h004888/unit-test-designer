openapi: 3.0.3
info:
  title: Order Service
  version: v1.0.0
  x-project-code: ORD
servers:
  - url: https://api.example.com
security:
  - bearerAuth: []
paths:
  /api/orders:
    post:
      summary: Tạo đơn hàng
      description: Tạo đơn hàng mới cho người dùng đang đăng nhập
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - productId
                - quantity
              properties:
                productId:
                  type: string
                  minLength: 3
                  maxLength: 20
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 100
                voucher:
                  type: string
                  enum:
                    - SAVE10
                    - SAVE20
      responses:
        '201':
          description: Tạo thành công
        '400':
          description: Dữ liệu không hợp lệ
          x-error-code: VALIDATION_ERROR
        '401':
          description: Thiếu token
  /api/orders/{id}:
    get:
      summary: Lấy đơn hàng theo id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Trả về đơn hàng
        '404':
          description: Không tìm thấy
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
